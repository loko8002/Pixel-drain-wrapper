name: Build APK & Publish Release

# Builds the installable debug APK on a GitHub-hosted runner (which has the
# Android SDK preinstalled and full internet access to fetch the Android Gradle
# Plugin and dependencies), then attaches it to a GitHub Release.

on:
  push:
    branches:
      - claude/pixeldrain-android-app-aani0b
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk pixeldrain-v1.0.0-debug.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixeldrain-debug-apk
          path: pixeldrain-v1.0.0-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Pixeldrain v1.0.0
          body: |
            Native Android wrapper for pixeldrain.com.

            **Asset:** `pixeldrain-v1.0.0-debug.apk` — installable debug build
            (signed with the standard Android debug key). To install on a phone,
            enable "Install unknown apps" for your browser/file manager, then
            open the APK.

            Built automatically from `claude/pixeldrain-android-app-aani0b`.
          files: pixeldrain-v1.0.0-debug.apk
          fail_on_unmatched_files: true
